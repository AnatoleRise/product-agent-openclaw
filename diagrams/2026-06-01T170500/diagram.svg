<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="'Noto Sans SC', sans-serif">

  <!-- Canvas -->
  <rect width="1200" height="1200" fill="#F8FAFC" />
  <rect x="0" y="0" width="1200" height="5" fill="#2563EB" />

  <!-- Title -->
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#0F172A">OpenClaw 产品全流程调度流程</text>

  <!-- ===== Section 1: Input & Parse ===== -->
  <rect x="50" y="68" width="1100" height="388" rx="14" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
  <rect x="66" y="82" width="4" height="14" rx="2" fill="#15803D" />
  <text x="80" y="95" font-size="13" fill="#15803D" font-weight="bold">输入与解析</text>

  <!-- Node 1: Start -->
  <rect x="470" y="115" width="260" height="50" rx="25" fill="#059669" />
  <text x="600" y="146" text-anchor="middle" font-size="18" fill="white" font-weight="bold">用户需求输入</text>

  <!-- Arrow 1→2 -->
  <line x1="600" y1="165" x2="600" y2="207" stroke="#94A3B8" stroke-width="1.8" />
  <polygon points="594,204 600,216 606,204" fill="#94A3B8" />

  <!-- Node 2 -->
  <rect x="400" y="216" width="400" height="54" rx="10" fill="#2563EB" />
  <text x="600" y="249" text-anchor="middle" font-size="17" fill="white" font-weight="bold">主智能体接收与解析意图</text>

  <!-- Arrow 2→3 -->
  <line x1="600" y1="270" x2="600" y2="308" stroke="#94A3B8" stroke-width="1.8" />
  <polygon points="594,305 600,317 606,305" fill="#94A3B8" />

  <!-- Node 3: Diamond -->
  <polygon points="600,312 714,362 600,412 486,362" fill="#D97706" />
  <text x="600" y="368" text-anchor="middle" font-size="15" fill="white" font-weight="bold">需求是否明确?</text>

  <!-- Arrow 3→4 (否) -->
  <polyline points="714,362 760,362 760,328 812,328" fill="none" stroke="#EF4444" stroke-width="1.8" />
  <polygon points="808,323 816,328 808,333" fill="#EF4444" />
  <text x="735" y="354" font-size="12" fill="#DC2626" font-weight="bold">否</text>

  <!-- Node 4 -->
  <rect x="816" y="305" width="240" height="46" rx="8" fill="#60A5FA" />
  <text x="936" y="333" text-anchor="middle" font-size="14" fill="white">提出澄清问题</text>

  <!-- Arrow 4→5 -->
  <line x1="936" y1="351" x2="936" y2="386" stroke="#94A3B8" stroke-width="1.8" />
  <polygon points="930,383 936,395 942,383" fill="#94A3B8" />

  <!-- Node 5 -->
  <rect x="816" y="393" width="240" height="46" rx="8" fill="#60A5FA" />
  <text x="936" y="421" text-anchor="middle" font-size="14" fill="white">用户确认目标与输出</text>

  <!-- Arrow 5→merge -->
  <polyline points="936,439 936,466 600,466" fill="none" stroke="#94A3B8" stroke-width="1.8" />

  <!-- Arrow 3→merge (是) -->
  <line x1="600" y1="412" x2="600" y2="466" stroke="#059669" stroke-width="1.8" stroke-dasharray="6,3" />
  <text x="615" y="442" font-size="12" fill="#059669" font-weight="bold">是</text>

  <!-- Merge → Node 6 -->
  <line x1="600" y1="466" x2="600" y2="514" stroke="#94A3B8" stroke-width="1.8" />
  <polygon points="594,511 600,523 606,511" fill="#94A3B8" />

  <!-- ===== Section 2: Routing ===== -->
  <rect x="50" y="475" width="1100" height="388" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
  <rect x="66" y="489" width="4" height="14" rx="2" fill="#1D4ED8" />
  <text x="80" y="502" font-size="13" fill="#1D4ED8" font-weight="bold">路由与调度</text>

  <!-- Node 6 -->
  <rect x="390" y="523" width="420" height="54" rx="10" fill="#2563EB" />
  <text x="600" y="556" text-anchor="middle" font-size="17" fill="white" font-weight="bold">选择最小必要子智能体组合</text>

  <!-- Arrow 6→group -->
  <line x1="600" y1="577" x2="600" y2="605" stroke="#94A3B8" stroke-width="1.8" />
  <polygon points="594,602 600,614 606,602" fill="#94A3B8" />

  <!-- Sub-agent group box -->
  <rect x="75" y="610" width="1050" height="225" rx="12" fill="white" fill-opacity="0.55" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="8,4" />
  <text x="102" y="632" font-size="12" fill="#3B82F6">子智能体池（按需组合）</text>

  <!-- Row 1 -->
  <rect x="85" y="645" width="280" height="78" rx="10" fill="#7C3AED" />
  <text x="225" y="679" text-anchor="middle" font-size="16" fill="white" font-weight="bold">客研需求</text>
  <text x="225" y="703" text-anchor="middle" font-size="11" fill="#DDD6FE">customer_research</text>

  <rect x="460" y="645" width="280" height="78" rx="10" fill="#0891B2" />
  <text x="600" y="679" text-anchor="middle" font-size="16" fill="white" font-weight="bold">产品探索</text>
  <text x="600" y="703" text-anchor="middle" font-size="11" fill="#A5F3FC">product_discovery</text>

  <rect x="835" y="645" width="280" height="78" rx="10" fill="#059669" />
  <text x="975" y="679" text-anchor="middle" font-size="16" fill="white" font-weight="bold">产品方案</text>
  <text x="975" y="703" text-anchor="middle" font-size="11" fill="#A7F3D0">solution_design</text>

  <!-- Row 2 -->
  <rect x="85" y="743" width="280" height="78" rx="10" fill="#EA580C" />
  <text x="225" y="777" text-anchor="middle" font-size="16" fill="white" font-weight="bold">需求评审</text>
  <text x="225" y="801" text-anchor="middle" font-size="11" fill="#FED7AA">requirement_review</text>

  <rect x="460" y="743" width="280" height="78" rx="10" fill="#DB2777" />
  <text x="600" y="777" text-anchor="middle" font-size="16" fill="white" font-weight="bold">需求管理</text>
  <text x="600" y="801" text-anchor="middle" font-size="11" fill="#FBCFE8">requirement_management</text>

  <rect x="835" y="743" width="280" height="78" rx="10" fill="#4F46E5" />
  <text x="975" y="777" text-anchor="middle" font-size="16" fill="white" font-weight="bold">用户分析</text>
  <text x="975" y="801" text-anchor="middle" font-size="11" fill="#C7D2FE">user_analysis</text>

  <!-- Arrow group→8 -->
  <line x1="600" y1="835" x2="600" y2="920" stroke="#94A3B8" stroke-width="1.8" />
  <polygon points="594,917 600,929 606,917" fill="#94A3B8" />

  <!-- ===== Section 3: Deliver ===== -->
  <rect x="50" y="880" width="1100" height="305" rx="14" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1" />
  <rect x="66" y="894" width="4" height="14" rx="2" fill="#C2410C" />
  <text x="80" y="907" font-size="13" fill="#C2410C" font-weight="bold">汇总与交付</text>

  <!-- Node 8 -->
  <rect x="430" y="926" width="340" height="56" rx="10" fill="#2563EB" />
  <text x="600" y="950" text-anchor="middle" font-size="16" fill="white" font-weight="bold">派发任务</text>
  <text x="600" y="970" text-anchor="middle" font-size="10" fill="#BFDBFE">sessions_spawn / sessions_send</text>

  <!-- Arrow 8→9 -->
  <line x1="600" y1="982" x2="600" y2="1012" stroke="#94A3B8" stroke-width="1.8" />
  <polygon points="594,1009 600,1021 606,1009" fill="#94A3B8" />

  <!-- Node 9 -->
  <rect x="420" y="1018" width="360" height="50" rx="10" fill="#2563EB" />
  <text x="600" y="1049" text-anchor="middle" font-size="16" fill="white" font-weight="bold">主智能体汇总与质检</text>

  <!-- Arrow 9→10 -->
  <line x1="600" y1="1068" x2="600" y2="1098" stroke="#94A3B8" stroke-width="1.8" />
  <polygon points="594,1095 600,1107 606,1095" fill="#94A3B8" />

  <!-- Node 10: End -->
  <rect x="470" y="1104" width="260" height="50" rx="25" fill="#059669" />
  <text x="600" y="1135" text-anchor="middle" font-size="18" fill="white" font-weight="bold">统一对外交付</text>

</svg>
